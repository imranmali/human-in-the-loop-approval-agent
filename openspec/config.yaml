schema: spec-driven

context: |
  Python 3.11+ library `hitl` (src layout: src/hitl/), standard library only at runtime.
  Tests use pytest + pytest-asyncio (asyncio_mode=auto) under tests/. Run: python3 -m pytest -q ; lint: ruff check .
  Everything must be deterministic and testable without network: time comes from hitl.core.Clock (ManualClock in tests),
  ids from hitl.core.new_id. Async APIs use asyncio; stores are pluggable via Protocols with an in-memory default so
  backends can be swapped for horizontal scale. Each capability lives in its own module and depends only on hitl.core
  (models, errors, Event/EventBus) — modules publish Events to an EventSink rather than importing each other.
  The top-level HITLAgent in hitl/agent.py composes them.

